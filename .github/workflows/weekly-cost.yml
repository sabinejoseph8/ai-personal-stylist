name: Weekly cost report

# 7c monitoring (Sabine's answer to Q2): every Monday at 8 am Cayman time (13:00 UTC), this month's
# video minutes and AI spend against each stop, as a GitHub issue, which GitHub emails to Sabine. Totals
# only: no guest, session or personal detail.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write the report
        run: node scripts/cost-report.mjs > report.md
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Open the issue
        run: gh issue create --title "Weekly cost report, $(date -u +%d\ %b\ %Y)" --body-file report.md
        env:
          GH_TOKEN: ${{ github.token }}
