<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2A44"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#1F2A44">AI Personal Stylist: how it works</text>
  <text x="40" y="70" font-size="15" fill="#5B6170">A shopper talks to a lifelike video stylist. Our server makes every decision; the stylist only speaks and listens.</text>

  <!-- Shopper -->
  <rect x="40" y="250" width="180" height="120" rx="10" fill="#E6EEF9" stroke="#1F2A44" stroke-width="2"/>
  <text x="130" y="290" font-size="18" font-weight="700" fill="#1F2A44" text-anchor="middle">Shopper</text>
  <text x="130" y="314" font-size="14" fill="#1F2A44" text-anchor="middle">Phone or laptop</text>
  <text x="130" y="334" font-size="14" fill="#1F2A44" text-anchor="middle">Talks, shows an item,</text>
  <text x="130" y="352" font-size="14" fill="#1F2A44" text-anchor="middle">taps to confirm or change</text>

  <!-- Browser -->
  <rect x="280" y="200" width="330" height="220" rx="10" fill="#E6EEF9" stroke="#1F2A44" stroke-width="2"/>
  <text x="445" y="232" font-size="18" font-weight="700" fill="#1F2A44" text-anchor="middle">The browser</text>
  <text x="300" y="262" font-size="14" fill="#1F2A44">Stylist stage, My Styling Notes (a notebook),</text>
  <text x="300" y="282" font-size="14" fill="#1F2A44">three looks, wardrobe, saved looks, demo bag</text>
  <text x="300" y="312" font-size="14" fill="#1F2A44">Holds the live call. Keeps no secret keys.</text>
  <text x="300" y="332" font-size="14" fill="#1F2A44">Sends words, photos and camera frames</text>
  <text x="300" y="352" font-size="14" fill="#1F2A44">to our server, and shows what comes back.</text>
  <text x="300" y="382" font-size="13" fill="#5B6170">Next.js, React. Browser tests on phone and desktop sizes.</text>

  <!-- Call providers (AI, outside) -->
  <rect x="680" y="100" width="480" height="64" rx="10" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="700" y="127" font-size="16" font-weight="700" fill="#0F5C3A">Video stylist: Tavus</text>
  <text x="700" y="149" font-size="14" fill="#1F2A44">A lifelike face and voice on a live call. Not recorded, deleted at the end.</text>
  <rect x="680" y="176" width="480" height="64" rx="10" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="2"/>
  <text x="700" y="203" font-size="16" font-weight="700" fill="#0F5C3A">Voice only, when video can't: OpenAI GPT-Live</text>
  <text x="700" y="225" font-size="14" fill="#1F2A44">The same stylist by voice. The browser can send it only facts and exact lines.</text>

  <!-- Outcome -->
  <rect x="680" y="270" width="480" height="150" rx="10" fill="#E6EEF9" stroke="#1F2A44" stroke-width="2"/>
  <text x="920" y="300" font-size="18" font-weight="700" fill="#1F2A44" text-anchor="middle">What the shopper gets</text>
  <text x="700" y="330" font-size="14" fill="#1F2A44">Notes jotted while they talk, confirmed or removed by a tap.</text>
  <text x="700" y="352" font-size="14" fill="#1F2A44">Three complete looks that never break a saved preference,</text>
  <text x="700" y="374" font-size="14" fill="#1F2A44">refined by voice or touch, with undo and compare.</text>
  <text x="700" y="400" font-size="14" fill="#1F2A44">Saved looks, a demo bag (nothing for sale), download or delete all data.</text>

  <!-- Server -->
  <rect x="280" y="455" width="560" height="190" rx="10" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
  <text x="300" y="484" font-size="18" font-weight="700" fill="#1F2A44">Our server (Vercel functions): every decision, every key</text>
  <rect x="300" y="498" width="250" height="64" rx="8" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="312" y="522" font-size="14" font-weight="700" fill="#0F5C3A">Notes and feedback reader</text>
  <text x="312" y="542" font-size="13" fill="#1F2A44">Claude Haiku 5.5, twice a second</text>
  <rect x="566" y="498" width="254" height="64" rx="8" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="578" y="522" font-size="14" font-weight="700" fill="#0F5C3A">Photo and camera reader</text>
  <text x="578" y="542" font-size="13" fill="#1F2A44">Claude Opus 5.5 and Haiku 5.5</text>
  <rect x="300" y="570" width="250" height="66" rx="8" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="312" y="594" font-size="14" font-weight="700" fill="#0F5C3A">Looks builder</text>
  <text x="312" y="612" font-size="13" fill="#1F2A44">Claude Opus 5.5, from a sample catalog</text>
  <rect x="566" y="570" width="254" height="66" rx="8" fill="#FBE9E7" stroke="#B3261E" stroke-width="1.5"/>
  <text x="578" y="594" font-size="14" font-weight="700" fill="#8A1C14">Preference check, then one gate</text>
  <text x="578" y="612" font-size="13" fill="#1F2A44">Rules in code, then Opus judges.</text>
  <text x="578" y="628" font-size="13" fill="#1F2A44">No pass, no look.</text>

  <!-- Storage -->
  <rect x="880" y="455" width="280" height="90" rx="10" fill="#FFF4E0" stroke="#B5651D" stroke-width="2"/>
  <text x="900" y="482" font-size="16" font-weight="700" fill="#7A4410">Supabase</text>
  <text x="900" y="504" font-size="13" fill="#1F2A44">Guest sign-in, notes, looks, preferences.</text>
  <text x="900" y="522" font-size="13" fill="#1F2A44">Only the server writes. Private photos,</text>
  <text x="900" y="540" font-size="13" fill="#1F2A44">deleted when a session ends.</text>

  <!-- Checks -->
  <rect x="880" y="560" width="280" height="85" rx="10" fill="#FBE9E7" stroke="#B3261E" stroke-width="2"/>
  <text x="900" y="586" font-size="16" font-weight="700" fill="#8A1C14">Quality checks</text>
  <text x="900" y="607" font-size="13" fill="#1F2A44">Budget guard on every paid call. Evals with</text>
  <text x="900" y="625" font-size="13" fill="#1F2A44">expected answers, 458 tests, browser tests,</text>
  <text x="900" y="641" font-size="13" fill="#1F2A44">accessibility and speed checks.</text>

  <!-- Arrows -->
  <line x1="220" y1="310" x2="278" y2="310" stroke="#1F2A44" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="250" x2="678" y2="160" stroke="#1F2A44" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="600" y="190" font-size="13" fill="#5B6170">live call</text>
  <line x1="610" y1="345" x2="678" y2="345" stroke="#1F2A44" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445" y1="420" x2="445" y2="453" stroke="#1F2A44" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="458" y="442" font-size="13" fill="#5B6170">signed-in requests</text>
  <line x1="840" y1="500" x2="878" y2="500" stroke="#1F2A44" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="600" x2="878" y2="600" stroke="#1F2A44" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="455" width="18" height="18" fill="#E6EEF9" stroke="#1F2A44" stroke-width="1.5"/>
  <text x="66" y="469" font-size="13" fill="#1F2A44">The shopper and what they see</text>
  <rect x="40" y="485" width="18" height="18" fill="#E7F4EE" stroke="#0F7A4B" stroke-width="1.5"/>
  <text x="66" y="499" font-size="13" fill="#1F2A44">AI parts, with their models</text>
  <rect x="40" y="515" width="18" height="18" fill="#FFF4E0" stroke="#B5651D" stroke-width="1.5"/>
  <text x="66" y="529" font-size="13" fill="#1F2A44">Where data is kept</text>
  <rect x="40" y="545" width="18" height="18" fill="#FBE9E7" stroke="#B3261E" stroke-width="1.5"/>
  <text x="66" y="559" font-size="13" fill="#1F2A44">Where quality is checked</text>
  <text x="40" y="600" font-size="13" fill="#5B6170">Sample products only. Nothing for sale.</text>
  <text x="40" y="620" font-size="13" fill="#5B6170">A portfolio project by Sabine Joseph, 2026.</text>
</svg>
